name: SpinPlot modularization preview
on:
  push:
    branches:
      - 'preview/modularization-*'
    paths-ignore:
      - 'preview-site/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Numeric helper regression
        run: node --test src/core/numeric.test.js
      - name: CSV and interpolation regression
        run: |
          node --test src/data/csv.test.js
          node --test src/processing/interpolation.test.js
      - name: One-dimensional processing regression
        run: node --test src/processing/signal.test.js
      - name: Project serialization and compatibility regression
        run: node --test src/project/project.test.js
      - name: Existing 2D regression
        run: |
          node src/twod/core.test.js
          node src/twod/bes3t.test.js
          node src/twod/large.test.js
          node src/twod/integration.test.js
          node src/twod/ticks.test.js
      - name: Production-equivalent build
        run: npm run build
      - name: Upload isolated preview build (not deployed)
        uses: actions/upload-artifact@v4
        with:
          name: spinplot-modularization-preview
          path: dist/
          retention-days: 14
          if-no-files-found: error
      - name: Build browser preview with relative URLs
        run: npx vite build --base=./ --outDir=preview-site
      - name: Commit static preview only to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f preview-site
          if git diff --cached --quiet; then
            echo "Preview build unchanged"
          else
            git commit -m "build(preview): static browser preview [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
